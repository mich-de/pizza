services:
  pizza-radar:
    build: .
    container_name: pizza-radar
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://pizzaradarsorrento.mdeangelis.me}
    volumes:
      - pizza-data:/app/server/private
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  pizza-data:
