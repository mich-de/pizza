services:
  pizza-radar:
    build: .
    container_name: pizza-radar
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - .env
    volumes:
      - pizza-data:/app/server/private
    tmpfs:
      - '/tmp:noexec,nosuid,size=64m'
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  pizza-data:
