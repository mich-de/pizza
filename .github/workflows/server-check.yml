name: Server Health Check

on:
  push:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Start server and check health
        run: |
          npm run server:dev &
          sleep 5
          curl -f http://localhost:3001/api/admin/me || exit 1
